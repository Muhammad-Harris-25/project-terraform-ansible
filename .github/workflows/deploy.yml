- name: Checkout code
  uses: actions/checkout@v3

- name: Set up Python
  uses: actions/setup-python@v4
  with:
    python-version: 3.12

- name: Install Ansible
  run: sudo apt update && sudo apt install -y ansible


- name: Setup Terraform
  uses: hashicorp/setup-terraform@v2
  with:
    terraform_version: 1.8.7

- name: Set up EC2 private key
  run: |
    echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/terraform-key.pem
    chmod 600 ~/terraform-key.pem

- name: Terraform Init & Apply
  working-directory: ./terraform
  run: terraform init && terraform apply -auto-approve

- name: Run Ansible Playbook
  run: ansible-playbook -i inventory.ini deploy_frontend.yml --private-key ~/terraform-key.pem -u ubuntu
